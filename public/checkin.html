<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEF Check-In</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { background: #f0f4f8; font-family: Arial, sans-serif; }

        header {
            background: #1a237e;
            color: white;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header h1 { font-size: 1.2rem; letter-spacing: 1px; text-transform: uppercase; }
        #logoutBtn {
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.35);
            color: white;
            padding: 0.4rem 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            transition: background 0.3s;
            margin-top: 0;
        }
        #logoutBtn:hover { background: rgba(255,255,255,0.28); }

        main { padding: 2rem 1rem; }

        /* ===== FLOATING LOGIN CARD ===== */
        #checkinLogin {
            background: white;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
            padding: 2.5rem;
            max-width: 420px;
            margin: 3rem auto;
        }
        #checkinLogin h2 {
            color: #1a237e;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            text-align: center;
        }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1.5px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            margin-top: 0;
        }
        .form-group input:focus { border-color: #1a237e; }

        #loginBtn {
            width: 100%;
            padding: 0.85rem;
            background: #1a237e;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: background 0.3s;
        }
        #loginBtn:hover { background: #283593; }

        .error-message {
            background: #fce4ec;
            color: #c62828;
            border-radius: 12px;
            padding: 0.75rem 1rem;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            display: none;
        }

        /* ===== CHECK-IN DASHBOARD ===== */
        .checkin-wrap {
            max-width: 480px;
            margin: 0 auto;
            padding: 1rem;
        }

        #scannerMsg {
            text-align: center;
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }

        /* Scanner box */
        #scanner-container {
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }
        #scanner-container video { width: 100%; display: block; }

        /* Result card */
        #resultCard {
            display: none;
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
            margin-bottom: 1.5rem;
        }

        .badge-strip {
            height: 12px;
            width: 100%;
        }

        .result-body { padding: 1.5rem; }
        .result-name { font-size: 1.4rem; font-weight: bold; margin: 0 0 0.5rem; color: #1a237e; }
        .result-meta { color: #555; font-size: 0.9rem; margin-bottom: 1rem; line-height: 1.8; }

        .result-category {
            display: inline-block;
            padding: 0.3rem 1rem;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.85rem;
            color: white;
            margin-bottom: 1rem;
        }

        /* Status alerts */
        .alert {
            padding: 1rem;
            border-radius: 16px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 1rem;
        }
        .alert-warning  { background: #fff3e0; color: #e65100; border: 1px solid #ffcc80; }
        .alert-danger   { background: #fce4ec; color: #c62828; border: 1px solid #ef9a9a; }
        .alert-success  { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
        .alert-info     { background: #e3f2fd; color: #1565c0; border: 1px solid #90caf9; }

        .btn-checkin {
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            background: #43a047;
            border-radius: 50px;
            margin-top: 0;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-checkin:hover { background: #2e7d32; }

        .btn-scan-again {
            width: 100%;
            background: #1a237e;
            border-radius: 50px;
            margin-top: 0.75rem;
            padding: 0.85rem;
            border: none;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-scan-again:hover { background: #283593; }
    </style>
</head>
<body>
    <header>
        <a href="/" class="back-btn" title="Back to Home">&#8249;</a>
        <h1>CEF Check-In</h1>
        <button id="logoutBtn" style="display:none" onclick="auth.signOut()">Logout</button>
    </header>
    <main>
        <!-- Login -->
        <div id="checkinLogin">
            <h2>Usher Login</h2>
            <div id="loginError" class="error-message"></div>
            <div class="form-group">
                <label for="adminEmail">Email</label>
                <input type="email" id="adminEmail" placeholder="usher@example.com">
            </div>
            <div class="form-group">
                <label for="adminPassword">Password</label>
                <input type="password" id="adminPassword">
            </div>
            <button id="loginBtn">Login</button>
        </div>

        <!-- Check-in UI -->
        <div id="checkinDashboard" style="display:none">
            <div class="checkin-wrap">
                <p id="scannerMsg">Point the camera at a participant's QR code</p>
                <div id="scanner-container">
                    <div id="qr-reader"></div>
                </div>

                <!-- Result card -->
                <div id="resultCard">
                    <div id="badgeStrip" class="badge-strip"></div>
                    <div class="result-body">
                        <p class="result-name" id="resName"></p>
                        <span class="result-category" id="resCategoryBadge"></span>
                        <p class="result-meta" id="resMeta"></p>
                        <div id="statusAlert"></div>
                        <button class="btn-checkin" id="btnCheckIn" style="display:none">
                            ✓ Mark as Checked In
                        </button>
                        <button class="btn-scan-again" onclick="resetScanner()">Scan Next</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="/__/firebase/12.11.0/firebase-app-compat.js"></script>
    <script src="/__/firebase/12.11.0/firebase-auth-compat.js"></script>
    <script src="/__/firebase/12.11.0/firebase-firestore-compat.js"></script>
    <script src="/__/firebase/init.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="js/checkin.js"></script>
</body>
</html>
