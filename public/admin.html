<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>County Energy Forum - Admin</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { background: linear-gradient(135deg, #e8f5e9 0%, #f0f4f8 50%, #e3f2fd 100%); font-family: Arial, sans-serif; min-height: 100vh; }

        header {
            background: #1a237e;
            color: white;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header h1 { font-size: 1.2rem; letter-spacing: 1px; text-transform: uppercase; }
        #logoutBtn {
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.35);
            color: white;
            padding: 0.4rem 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            transition: background 0.3s;
        }
        #logoutBtn:hover { background: rgba(255,255,255,0.28); }

        main { padding: 2rem 1rem; max-width: 1200px; margin: 0 auto; }

        /* ===== ANIMATIONS ===== */
        #loginForm {
            background: white;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
            padding: 2.5rem;
            max-width: 420px;
            margin: 3rem auto;
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        #dashboard { animation: fadeIn 0.5s ease; }
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        #regBody tr { animation: rowIn 0.3s ease both; }
        @keyframes rowIn {
            from { opacity: 0; transform: translateX(-10px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        .btn-approve, .btn-reject { position: relative; overflow: hidden; }
        .ripple {
            position: absolute; border-radius: 50%;
            background: rgba(255,255,255,0.4);
            transform: scale(0);
            animation: rippleAnim 0.5s ease;
            pointer-events: none;
        }
        @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }
        .stat-pulse { animation: statPulse 0.6s ease; }
        @keyframes statPulse {
            0%   { box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
            50%  { box-shadow: 0 8px 32px rgba(27,94,32,0.5), 0 0 0 4px rgba(67,160,71,0.3); }
            100% { box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
        }

        #loginForm h2 {
            color: #1a237e;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            text-align: center;
        }

        /* Rounded inputs */
        .form-group { margin-bottom: 1.2rem; }
        .form-group label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1.5px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus { border-color: #1a237e; }

        #loginBtn {
            width: 100%;
            padding: 0.85rem;
            background: #1a237e;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: background 0.3s;
        }
        #loginBtn:hover { background: #283593; }

        .error-message {
            background: #fce4ec;
            color: #c62828;
            border-radius: 12px;
            padding: 0.75rem 1rem;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            display: none;
        }

        /* ===== DASHBOARD ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .stat-card {
            background: white;
            border-radius: 20px;
            padding: 1rem;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        .stat-card span { display: block; font-size: 2rem; font-weight: bold; color: #1a237e; }
        .stat-card label { font-size: 0.75rem; color: #666; margin-top: 0.25rem; }

        .admin-filters {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            background: white;
            padding: 1rem 1.25rem;
            border-radius: 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        .admin-filters input,
        .admin-filters select {
            flex: 1;
            min-width: 140px;
            padding: 0.6rem 1rem;
            border: 1.5px solid #ddd;
            border-radius: 50px;
            font-size: 0.9rem;
            outline: none;
            margin-top: 0;
        }
        .admin-filters button {
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            font-size: 0.9rem;
            margin-top: 0;
        }

        .table-wrap {
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        #regTable { width: 100%; border-collapse: collapse; font-size: 0.9rem; min-width: 700px; }
        #regTable th {
            background: #1a237e;
            color: white;
            padding: 0.75rem 1rem;
            text-align: left;
            white-space: nowrap;
        }
        #regTable td { padding: 0.65rem 1rem; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
        #regTable tr:last-child td { border-bottom: none; }
        #regTable tr:hover td { background: #f9f9f9; }

        .cat-select { width: auto; padding: 0.3rem 0.6rem; font-size: 0.85rem; border-radius: 50px; border: 1.5px solid #ddd; margin-top: 0; }

        .status-badge { padding: 0.2rem 0.8rem; border-radius: 50px; font-size: 0.8rem; font-weight: bold; text-transform: capitalize; }
        .status-pending    { background: #fff3e0; color: #e65100; }
        .status-approved   { background: #e8f5e9; color: #2e7d32; }
        .status-rejected   { background: #fce4ec; color: #c62828; }
        .status-checked-in { background: #e3f2fd; color: #1565c0; }

        .action-btns { display: flex; gap: 0.4rem; }
        .action-btns button { margin-top: 0; padding: 0.3rem 0.8rem; font-size: 0.8rem; border-radius: 50px; }
        .btn-approve { background: #43a047; }
        .btn-approve:hover { background: #2e7d32; }
        .btn-reject  { background: #e53935; }
        .btn-reject:hover  { background: #c62828; }

        /* ===== GLASS STAT CARDS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .stat-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.6), rgba(255,255,255,0.2));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 20px;
            padding: 1.25rem 1rem;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1), inset 0 1px 0 rgba(255,255,255,0.6);
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 60%);
            pointer-events: none;
        }
        .stat-card:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 16px 40px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.8);
        }
        .stat-card span {
            display: block;
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #1b5e20, #43a047);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 0.4rem;
        }
        .stat-card label {
            font-size: 0.75rem;
            color: #555;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ===== TABLE TOOLBAR ===== */
        .table-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 0.75rem 1rem;
            border-radius: 16px;
            margin-bottom: 0.8rem;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .table-toolbar .left { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: #555; }
        .table-toolbar .right { display: flex; gap: 0.5rem; }
        .table-toolbar button { padding: 0.4rem 1rem; border-radius: 50px; font-size: 0.8rem; margin-top: 0; }
        .btn-bulk-approve { background: #43a047; }
        .btn-bulk-reject  { background: #e53935; }

        /* ===== SKELETON LOADER ===== */
        .skeleton {
            height: 200px;
            border-radius: 16px;
            background: linear-gradient(90deg, #eee 25%, #f5f5f5 50%, #eee 75%);
            background-size: 400px 100%;
            animation: shimmer 1.2s infinite;
            margin-bottom: 1rem;
        }
        @keyframes shimmer {
            0%   { background-position: -400px 0; }
            100% { background-position: 400px 0; }
        }

        /* ===== PAGINATION ===== */
        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-top: 1rem;
            padding: 0.75rem;
        }
        .pagination button {
            padding: 0.4rem 1.2rem;
            border-radius: 50px;
            font-size: 0.85rem;
            margin-top: 0;
            background: #1a237e;
        }
        .pagination button:disabled { background: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }
        .pagination span { font-size: 0.85rem; color: #555; }

        /* ===== SORTABLE HEADERS ===== */
        #regTable th.sortable { cursor: pointer; user-select: none; }
        #regTable th.sortable:hover { background: #283593; }
        #regTable th .sort-icon { margin-left: 4px; opacity: 0.6; font-size: 0.75rem; }
        #regTable th.sort-asc .sort-icon::after  { content: ' ▲'; }
        #regTable th.sort-desc .sort-icon::after { content: ' ▼'; }
        #regTable th:not(.sort-asc):not(.sort-desc) .sort-icon::after { content: ' ⬍'; }

        /* ===== ROW TRANSITION ===== */
        #regBody { transition: opacity 0.2s ease; }
        #regBody tr { transition: background 0.2s; }
        .row-selected td { background: #e8f5e9 !important; }
        .detail-cell {
            background: #f9f9f9;
            padding: 0.75rem 1rem;
            font-size: 0.85rem;
            color: #444;
            border-bottom: 2px solid #e0e0e0;
        }
    </style>
</head>
<body>
    <header>
        <a href="/" class="back-btn" title="Back to Home">&#8249;</a>
        <h1>CEF Admin Dashboard</h1>
        <div style="display:flex;gap:0.5rem;align-items:center;">
            <button id="statsBtn" onclick="toggleStats()" style="display:none;background:rgba(255,255,255,0.15);border:2px solid rgba(255,255,255,0.35);color:white;padding:0.4rem 1.2rem;border-radius:50px;cursor:pointer;font-size:0.85rem;font-weight:bold;margin-top:0;">&#128202; Stats</button>
            <button id="logoutBtn" style="display:none" onclick="auth.signOut()">Logout</button>
        </div>
    </header>
    <main>
        <!-- Login -->
        <div id="loginForm">
            <h2>Admin Login</h2>
            <div id="loginError" class="error-message"></div>
            <div class="form-group">
                <label for="adminEmail">Email</label>
                <input type="email" id="adminEmail" placeholder="admin@example.com">
            </div>
            <div class="form-group">
                <label for="adminPassword">Password</label>
                <input type="password" id="adminPassword">
            </div>
            <button id="loginBtn">Login</button>
        </div>

        <!-- Dashboard -->
        <div id="dashboard">

            <!-- Filters -->
            <div class="admin-filters">
                <input type="text" id="searchInput" placeholder="Search name, email, org…" oninput="currentPage=1;renderTable()">
                <select id="filterCategory" onchange="currentPage=1;renderTable()">
                    <option value="">All Categories</option>
                    <option>VVIP</option><option>VIP</option>
                    <option>Delegate</option><option>Media</option><option>Staff</option>
                </select>
                <select id="filterStatus" onchange="currentPage=1;renderTable()">
                    <option value="">All Statuses</option>
                    <option>pending</option><option>approved</option>
                    <option>rejected</option><option>checked-in</option>
                </select>
                <button onclick="exportCSV()" style="background:#2e7d32;margin-top:0;">⬇ Export CSV</button>
            </div>

            <!-- Table Toolbar -->
            <div class="table-toolbar">
                <div class="left">
                    <input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)">
                    <span id="selectedCount">0 selected</span>
                </div>
                <div class="right">
                    <button class="btn-bulk-approve" onclick="bulkAction('approved')">&#10003; Approve Selected</button>
                    <button class="btn-bulk-reject" onclick="bulkAction('rejected')">&#10007; Reject Selected</button>
                </div>
            </div>

            <!-- Skeleton Loader -->
            <div id="tableLoader" class="skeleton" style="display:none;"></div>

            <!-- Table -->
            <div class="table-wrap">
                <table id="regTable">
                    <thead>
                        <tr>
                            <th><input type="checkbox" id="selectAllHeader" onchange="toggleSelectAll(this)"></th>
                            <th class="sortable" onclick="sortTable('name')">Name<span class="sort-icon"></span></th>
                            <th>Phone</th>
                            <th class="sortable" onclick="sortTable('organization')">Organisation<span class="sort-icon"></span></th>
                            <th>Designation</th>
                            <th>County</th>
                            <th class="sortable" onclick="sortTable('category')">Category<span class="sort-icon"></span></th>
                            <th class="sortable" onclick="sortTable('status')">Status<span class="sort-icon"></span></th>
                            <th class="sortable" onclick="sortTable('timestamp')">Registered<span class="sort-icon"></span></th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="regBody"></tbody>
                </table>
                <p id="emptyMsg" style="display:none;text-align:center;color:#888;padding:2rem">No registrations match the filter.</p>

                <!-- Pagination -->
                <div class="pagination">
                    <button id="prevBtn" onclick="prevPage()" disabled>&#8592; Prev</button>
                    <span id="pageInfo"></span>
                    <button id="nextBtn" onclick="nextPage()">Next &#8594;</button>
                </div>
            </div>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card"><span id="statTotal">0</span><label>Total</label></div>
                <div class="stat-card"><span id="statPending">0</span><label>Pending</label></div>
                <div class="stat-card"><span id="statApproved">0</span><label>Approved</label></div>
                <div class="stat-card"><span id="statCheckedIn">0</span><label>Checked In</label></div>
                <div class="stat-card"><span id="statVVIP">0</span><label>VVIP</label></div>
                <div class="stat-card"><span id="statVIP">0</span><label>VIP</label></div>
                <div class="stat-card"><span id="statDelegate">0</span><label>Delegate</label></div>
                <div class="stat-card"><span id="statMedia">0</span><label>Media</label></div>
            </div>

        </div>
    </main>
    <!-- Stats Overlay -->
    <div id="statsOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9000;overflow-y:auto;padding:2rem 1rem;">
        <div style="background:white;border-radius:24px;max-width:900px;margin:0 auto;padding:2rem;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;">
                <h2 style="color:#1b5e20;font-size:1.3rem;">&#128202; Registration Statistics</h2>
                <button onclick="toggleStats()" style="background:#f0f4f8;color:#333;border:none;border-radius:50px;padding:0.4rem 1rem;cursor:pointer;font-size:0.9rem;margin-top:0;">&#10005; Close</button>
            </div>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.5rem;">
                <div style="background:#f8fdf8;border-radius:16px;padding:1.25rem;">
                    <h4 style="font-size:0.8rem;color:#555;text-transform:uppercase;letter-spacing:1px;margin-bottom:1rem;text-align:center;">By Category</h4>
                    <div style="position:relative;height:220px;"><canvas id="categoryChart"></canvas></div>
                </div>
                <div style="background:#f8fdf8;border-radius:16px;padding:1.25rem;">
                    <h4 style="font-size:0.8rem;color:#555;text-transform:uppercase;letter-spacing:1px;margin-bottom:1rem;text-align:center;">By Status</h4>
                    <div style="position:relative;height:220px;"><canvas id="statusChart"></canvas></div>
                </div>
                <div style="background:#f8fdf8;border-radius:16px;padding:1.25rem;grid-column:1/-1;">
                    <h4 style="font-size:0.8rem;color:#555;text-transform:uppercase;letter-spacing:1px;margin-bottom:1rem;text-align:center;">Registrations Over Time</h4>
                    <div style="position:relative;height:220px;"><canvas id="timeChart"></canvas></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden container for QR code generation when sending approval emails -->
    <div id="qrEmailContainer" style="display:none;"></div>

    <script src="/__/firebase/12.11.0/firebase-app-compat.js"></script>
    <script src="/__/firebase/12.11.0/firebase-auth-compat.js"></script>
    <script src="/__/firebase/12.11.0/firebase-firestore-compat.js"></script>
    <script src="/__/firebase/init.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
